<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JPR Coach">
<meta name="theme-color" content="#202a34">
<title>JPR Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
@font-face{font-family:"Inter";font-weight:400;font-display:swap;src:url(fonts/inter-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:500;font-display:swap;src:url(fonts/inter-latin-500-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:600;font-display:swap;src:url(fonts/inter-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Inter";font-weight:700;font-display:swap;src:url(fonts/inter-latin-700-normal.woff2) format("woff2")}
:root{
  --navy:#202a34; --navy2:#2c3846; --gold:#9c7a3c; --gold-soft:#efe4cf; --cream:#f7efe6; --alt:#f9f6ef;
  --line:#e9e2d7; --text:#1a1a1a; --muted:#6f685e; --bg:#fbf9f5; --card:#fff;
  --ok:#3b7d4f; --ok-soft:#e5f1e8; --warn:#a8641d; --warn-soft:#f8ead8; --bad:#b3412f; --bad-soft:#f7e3df;
  --serif:"Times New Roman",Times,Georgia,serif;
  --sans:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.45}
body{min-height:100vh;padding-bottom:calc(var(--safe-b) + 84px)}
body.no-tabs{padding-bottom:calc(var(--safe-b) + 24px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--gold)}
h1,h2,h3{font-family:var(--serif);margin:0;font-weight:700;letter-spacing:.01em}
h1{font-size:24px} h2{font-size:20px} h3{font-size:17px}
.muted{color:var(--muted)} .small{font-size:13px} .tiny{font-size:12px}
.gold{color:var(--gold)} .center{text-align:center}
.hidden{display:none!important}

/* ---------- Top bar ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;
  padding:calc(var(--safe-t) + 10px) 16px 12px;display:flex;align-items:center;gap:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.top .logo{height:34px;width:auto;display:block}
.top .title{flex:1;min-width:0}
.top .title b{font-family:var(--serif);font-size:18px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .title small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#c9b48a;font-size:12px;letter-spacing:.06em;text-transform:uppercase}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.icon-btn svg{width:20px;height:20px}
.demo-flag{background:var(--gold);color:#fff;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;letter-spacing:.05em}

main{max-width:820px;margin:0 auto;padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}
.sec-title{display:flex;align-items:center;gap:8px;margin:18px 2px 8px;font-family:var(--serif);font-weight:700;font-size:15px;text-transform:uppercase;letter-spacing:.04em}
.sec-title::before{content:"◆";color:var(--gold);font-size:12px}
.sec-title .r{margin-left:auto;font-family:var(--sans);text-transform:none;letter-spacing:0;font-size:13px;font-weight:500}

/* ---------- Cards ---------- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.card.tap{cursor:pointer;transition:transform .08s}
.card.tap:active{transform:scale(.99)}
.card.cream{background:var(--cream);border-color:#eadbc6}
.card h3{margin-bottom:4px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;flex:0 0 auto;font-family:var(--serif)}
.avatar.lg{width:58px;height:58px;font-size:22px}
.chev{color:#b9b0a3;font-size:22px}
.badge{background:var(--alt);color:var(--muted);display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:99px;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.gold{background:var(--gold-soft);color:var(--gold)}
.badge.navy{background:var(--navy);color:#fff}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-size:20px;font-family:var(--serif)}
.stat i{font-style:normal;font-size:12px;margin-left:4px}
.up{color:var(--bad)} .down{color:var(--ok)}
.empty{text-align:center;padding:26px 16px;color:var(--muted)}
.empty b{display:block;color:var(--text);font-family:var(--serif);font-size:17px;margin-bottom:4px}

/* ---------- Buttons ---------- */
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;min-height:46px}
.btn:active{transform:scale(.98)}
.btn svg{width:18px;height:18px}
.btn.block{width:100%}
.btn.gold{background:var(--gold)}
.btn.light{background:var(--card);color:var(--navy);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--navy);padding:8px 10px;min-height:36px}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn.sm{padding:8px 12px;min-height:36px;font-size:14px;border-radius:10px}
.btn[disabled]{opacity:.5;pointer-events:none}
.mini{border:0;background:var(--alt);border-radius:9px;width:34px;height:34px;display:grid;place-items:center;cursor:pointer;color:var(--navy);flex:0 0 auto}
.mini svg{width:16px;height:16px}
.mini.bad{color:var(--bad)}

/* ---------- Forms ---------- */
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
.in,select.in,textarea.in{width:100%;border:1px solid var(--line);background:#fff;border-radius:11px;padding:11px 12px;font-size:16px;color:var(--text);font-weight:400;outline:none}
.in:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
textarea.in{min-height:84px;resize:vertical;line-height:1.4}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--navy);flex:0 0 auto}
.seg{display:flex;background:var(--alt);border-radius:12px;padding:4px;gap:4px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;border:0;background:transparent;padding:9px 9px;border-radius:9px;font-weight:600;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(0,0,0,.08)}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 0;font-weight:600;cursor:pointer}
.scale button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- Plan editor ---------- */
.day{border:1px solid var(--line);border-radius:var(--radius);background:#fff;overflow:hidden}
.day-head{background:var(--navy);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center}
.day-head .in{background:rgba(255,255,255,.1);border-color:transparent;color:#fff;font-weight:700;font-family:var(--serif);font-size:17px;padding:8px 10px}
.day-head .mini{background:rgba(255,255,255,.12);color:#fff}
.ex{padding:12px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.ex:nth-child(even){background:var(--alt)}
.ex-top{display:flex;gap:8px;align-items:center}
.ex-num{width:24px;height:24px;border-radius:50%;background:var(--gold-soft);color:var(--gold);font-weight:700;font-size:12px;display:grid;place-items:center;flex:0 0 auto}
.ex .grid4 .in{padding:9px 8px;font-size:15px;text-align:center}
.ex .lbl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center;margin-bottom:2px}
.day-foot{padding:10px 12px}

/* ---------- Session (client) ---------- */
.exs{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.exs-head{padding:12px 14px;border-bottom:1px solid var(--line)}
.exs-head b{font-family:var(--serif);font-size:17px}
.target{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--alt);border-radius:8px;padding:3px 8px;font-size:12px;font-weight:600;color:var(--navy)}
.chip.gold{background:var(--gold-soft);color:var(--gold)}
.set{display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:8px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.set .n{font-weight:700;color:var(--muted);text-align:center}
.set .in{text-align:center;padding:10px 6px}
.set-head{padding:6px 14px 0;display:grid;grid-template-columns:34px 1fr 1fr 40px;gap:8px;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;text-align:center}
.set.done{background:var(--ok-soft)}
.tick{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;color:#c8c0b3}
.tick svg{width:20px;height:20px}
.set.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.exs-foot{padding:8px 14px;background:var(--alt)}

/* ---------- Meals ---------- */
.meal{background:#fff;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.meal-head{background:var(--navy);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px}
.meal-head b{font-family:var(--serif);font-size:17px;flex:1}
.meal-head span{color:#c9b48a;font-size:13px}
.opt{display:grid;grid-template-columns:44px 1fr;border-bottom:1px solid var(--line)}
.opt:last-child{border-bottom:0}
.opt .k{padding:10px 0 10px 14px;font-weight:700;color:var(--gold);font-size:14px;font-family:var(--serif)}
.opt .v{padding:10px 14px 10px 0;font-size:14px}
.opt.special{background:var(--cream)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.macro{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.macro b{display:block;font-family:var(--serif);font-size:20px}
.macro b i{font-style:normal;font-size:13px;margin-left:1px}
.macro small{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.prose{white-space:pre-wrap;font-size:14px}

/* ---------- Charts ---------- */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:#efe9df;stroke-width:1}
.chart .ln{fill:none;stroke:var(--navy);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:url(#cg);opacity:.9}
.chart .dt{fill:#fff;stroke:var(--navy);stroke-width:2}
.chart .dt.last{fill:var(--gold);stroke:var(--gold)}
.chart text{font-size:11px;fill:var(--muted);font-family:var(--sans)}

/* ---------- Table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{background:var(--navy);color:#fff;font-weight:600;padding:8px 6px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line)}
.tbl tr:nth-child(even) td{background:var(--alt)}
.tbl-wrap{overflow-x:auto;border-radius:12px;border:1px solid var(--line);background:#fff}

/* ---------- Tabs bar ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  display:flex;padding:6px 6px calc(var(--safe-b) + 6px);box-shadow:0 -4px 16px rgba(0,0,0,.04)}
.tabs button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;color:#9b9387;font-size:11px;font-weight:600;cursor:pointer}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--navy)}
.tabs button.on svg{color:var(--gold)}

/* ---------- Auth ---------- */
.auth{min-height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px)}
.auth .logo{width:min(280px,70vw);height:auto;margin-bottom:10px}
.auth .box{width:100%;max-width:400px;background:#fff;color:var(--text);border-radius:20px;padding:22px}
.auth h1{margin-bottom:4px}
.auth .alt{margin-top:14px;text-align:center;font-size:14px;color:#c9c3b8}
.auth .alt a{color:#e2cfa6;font-weight:600}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:10px;font-size:14px}
.info{background:var(--gold-soft);color:#6d5426;padding:10px 12px;border-radius:10px;font-size:14px}

/* ---------- Overlays ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;
  padding:12px 18px;border-radius:12px;font-weight:600;font-size:14px;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(20,26,33,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:20px 18px calc(var(--safe-b) + 18px);max-height:90vh;overflow:auto}
@media (min-width:700px){ .modal{align-items:center} .sheet{border-radius:20px} }
.spinner{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
.offline{background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;text-align:center;padding:6px}

@media (min-width:700px){
  .stats{grid-template-columns:repeat(4,1fr)}
}

/* ---------- Mensajes ---------- */
.tabs button{position:relative}
.tb-badge{position:absolute;top:0;left:calc(50% + 5px);background:var(--bad);color:#fff;font-size:10px;font-weight:700;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;line-height:1}
.cnt{display:inline-grid;place-items:center;background:var(--bad);color:#fff;font-size:11px;font-weight:700;min-width:20px;height:20px;border-radius:10px;padding:0 6px;line-height:1;vertical-align:middle}
.chat{display:flex;flex-direction:column;gap:6px;justify-content:flex-end;min-height:calc(100vh - 260px);padding-bottom:6px}
.bub{max-width:82%;align-self:flex-start;background:#fff;border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.bub.me{align-self:flex-end;background:var(--navy);color:#fff;border-color:var(--navy);border-radius:16px 16px 4px 16px}
.bub.pend{opacity:.55}
.bt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.bm{font-size:11px;opacity:.65;text-align:right;margin-top:2px}
.bm .rd{color:#e2cfa6;font-weight:700}
.daysep{align-self:center;font-size:12px;color:var(--muted);background:var(--alt);padding:3px 10px;border-radius:99px;margin:10px 0 4px}
.daysep::first-letter{text-transform:uppercase}
.composer{position:sticky;bottom:calc(var(--safe-b) + 72px);display:flex;gap:8px;align-items:flex-end;padding:10px 0 6px;background:var(--bg);z-index:5}
body.no-tabs .composer{bottom:calc(var(--safe-b) + 6px)}
.composer textarea{resize:none;min-height:46px;max-height:140px;line-height:1.35;border-radius:14px}
.composer .btn{width:50px;padding:0;flex:0 0 auto}

/* ---------- Fotos ---------- */
.pdate{font-size:13px;font-weight:600;color:var(--muted);margin:14px 2px 6px}
.pdate::first-letter{text-transform:uppercase}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{border:0;padding:0;background:var(--alt);border-radius:10px;overflow:hidden;position:relative;aspect-ratio:3/4;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:6px;bottom:6px;background:rgba(32,42,52,.78);color:#fff;font-size:11px;padding:2px 7px;border-radius:6px;text-transform:capitalize}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0}
.cmp img,.cmp .noimg{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:10px;background:var(--alt);display:block}
.cmp figcaption{font-size:12px;text-align:center;color:var(--muted);margin-top:4px}
.upl{display:block;cursor:pointer}
.upl-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:3/4;border:1.5px dashed #d8cdbb;border-radius:12px;background:var(--alt) center/cover no-repeat;color:var(--navy);text-align:center}
.upl-box svg{width:24px;height:24px}
.upl-box b{font-size:14px}
.upl-box small{font-size:11px;color:var(--muted)}
.upl-box.has{border-style:solid;border-color:var(--gold)}
.upl-box.has > *{visibility:hidden}
label.btn{cursor:pointer}

/* =================== Mejora de contraste y jerarquía (v3) =================== */
:root{ --bg:#f2ede4; --line:#ddd2c1; --muted:#5d574e; --gold-soft:#f0e3c8; --alt:#f6f1e8; }
html,body{font-size:16px}
.small{font-size:14px} .tiny{font-size:13px}
.card{border-color:var(--line);box-shadow:0 1px 2px rgba(32,42,52,.06),0 4px 14px rgba(32,42,52,.05)}
.card.cream{background:#f8eedc;border-color:#e6d2ad}
.sec-title{font-size:17px;color:var(--navy);margin:22px 2px 10px;padding-bottom:6px;border-bottom:2px solid #e4d8c4}
.sec-title::before{font-size:13px}

/* Pestañas superiores: la activa en azul marino */
.seg{background:#e6dfd2;padding:4px}
.seg button{color:#4f4a42;font-size:14px}
.seg button.on{background:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(32,42,52,.25)}
.seg button.on .cnt{background:#fff;color:var(--bad)}

/* Barra inferior: la sección activa con fondo y raya dorada */
.tabs{border-top:1px solid var(--line)}
.tabs button{color:#7d766b;border-radius:12px;margin:0 2px;font-size:11.5px}
.tabs button.on{color:var(--navy);background:var(--cream);font-weight:700}
.tabs button.on::before{content:"";position:absolute;top:-6px;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--gold)}

/* Datos clave */
.stat{border-color:var(--line);border-top:3px solid var(--navy);box-shadow:0 1px 2px rgba(32,42,52,.05)}
.stat small{color:#5d574e;font-size:11.5px;font-weight:600}
.stat b{font-size:22px;color:var(--navy)}

/* Botones y campos */
.btn.light{border:1.5px solid #cfc2ad;color:var(--navy)}
.in,select.in,textarea.in{border:1.5px solid #d9cebd}
.mini{background:#ece5d9}
.chip{background:#e9e2d5;color:#2b3642;font-size:13px}
.chip.gold{background:var(--gold-soft);color:#7a5c22}
label.f{color:#4f4a42}

/* Estados con color: te toca, retrasado, pendiente */
.card.next{border:2px solid var(--gold);box-shadow:0 4px 18px rgba(156,122,60,.18)}
.card.late{border-left:5px solid var(--bad)}
.card.pend{border-left:5px solid var(--gold)}
.card.ok-l{border-left:5px solid var(--ok)}
.late-tag{display:inline-block;background:var(--bad-soft);color:var(--bad);font-size:11px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:4px;vertical-align:1px}
.badge{font-size:11.5px;padding:4px 9px}

/* Ejercicios y comidas más separados */
.exs-head{background:#faf6ef;border-bottom:1px solid var(--line)}
.exs-head b{color:var(--navy);font-size:18px}
.set-head{color:#5d574e;font-weight:600}
.opt{border-bottom-color:#e9e0d1}
.opt:nth-child(even){background:#fbf8f2}
.macro{border-top:3px solid var(--gold)}
.macro b{color:var(--navy)}
.tbl th{font-size:11.5px}
.daysep{background:#e6dfd2;color:#4f4a42;font-weight:600}
.empty b{color:var(--navy)}

/* Cabeceras oscuras para separar bloques; valores apuntados en negrita */
.dcard{padding:0;overflow:hidden}
.dhead{background:var(--navy);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dhead h3{color:#fff;margin:0}
.dcard.next .dhead{background:var(--gold)}
.badge.tt{background:#fff;color:var(--gold)}
.dbody{padding:12px 14px 14px}
.exs{box-shadow:0 1px 2px rgba(32,42,52,.06),0 4px 14px rgba(32,42,52,.05)}
.exs-head{background:var(--navy);color:#fff;border-bottom:0}
.exs-head b{color:#fff}
.exs-head .muted{color:#d5cfc4!important}
.exs-head .chip{background:rgba(255,255,255,.14);color:#fff}
.exs-head .chip.gold{background:var(--gold);color:#fff}
.set .in{font-weight:700;color:var(--navy);font-size:17px}
.set .in::placeholder{color:#bdb4a6;font-weight:400;font-style:italic}
.set.done .in{border-color:#9cc7a9;background:#fff}
.mini.ic-train{background:var(--navy);color:#fff}
.mini.ic-food{background:var(--gold);color:#fff}

/* ---------- Pagos ---------- */
.paycard{border-top:4px solid var(--gold)}
.paycard.bad{border-top-color:var(--bad);background:#fdf3f1}
.paycard .badge{flex:0 0 auto}
.tbl td .mini{display:inline-grid;vertical-align:middle;margin-left:6px;width:30px;height:30px}
