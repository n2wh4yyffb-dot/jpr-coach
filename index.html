<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="JPR Coach">
<meta name="theme-color" content="#202a34">
<title>JPR Coach</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<style>
@font-face{font-family:"Archivo";font-style:normal;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(fonts/archivo-latin-wdth-normal.woff2) format("woff2")}
@font-face{font-family:"Archivo";font-style:italic;font-weight:100 900;font-stretch:62% 125%;font-display:swap;src:url(fonts/archivo-latin-wdth-italic.woff2) format("woff2")}
:root{
  /* Marca JPR Coach */
  --navy:#202a34; --navy-2:#2b3744; --navy-3:#3a4857;
  --gold:#9c7a3c; --gold-hi:#c9a35c; --gold-soft:#efe3c7;
  --cream:#f7efe6;
  /* Taller: gris tiza frío, acero y tinta */
  --chalk:#e9ecef; --sheet:#ffffff; --rule:#d2d8de; --rule-2:#e4e8ec;
  --ink:#1b232c; --steel:#56626f; --steel-2:#8994a0;
  --ok:#2e7a51; --ok-soft:#e1efe6; --warn:#a5661c; --warn-soft:#f6e9d6; --bad:#b3412f; --bad-soft:#f6e1dc;
  --cond:"Archivo",-apple-system,"Helvetica Neue",Arial,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --r:4px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--chalk);color:var(--ink);font-family:var(--cond);font-size:16px;line-height:1.45;font-stretch:100%}
body{min-height:100vh;padding-bottom:calc(var(--safe-b) + 84px)}
body.no-tabs{padding-bottom:calc(var(--safe-b) + 24px)}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--navy);text-decoration-color:var(--gold);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* Titulares: Archivo estrecho e inclinado, como el logo */
h1,h2,h3{font-family:var(--cond);font-style:italic;font-stretch:72%;font-weight:800;margin:0;letter-spacing:-.005em;color:var(--navy);line-height:1.05}
h1{font-size:36px} h2{font-size:25px} h3{font-size:20px}
.muted{color:var(--steel)} .small{font-size:14px} .tiny{font-size:13px} .gold{color:var(--gold)} .center{text-align:center}
.hidden{display:none!important}

/* Marca de agua: el logo grande y suave en el centro de cada pantalla, como en los PDF */
body::after{content:"";position:fixed;left:50%;top:52%;width:min(78vw,560px);aspect-ratio:436/233;transform:translate(-50%,-50%);
  background:url(assets/logo-mark.png) center/contain no-repeat;opacity:.07;pointer-events:none;z-index:15;mix-blend-mode:multiply}
body:has(.auth)::after{display:none}

/* ---------- Barra superior ---------- */
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(var(--safe-t) + 10px) 16px 11px;display:flex;align-items:center;gap:12px;border-bottom:3px solid var(--gold)}
.top .logo{height:30px;width:auto;display:block}
.top .title{flex:1;min-width:0}
.top .title b{font-style:italic;font-stretch:72%;font-weight:800;font-size:23px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.top .title small{display:block;color:#aeb8c2;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:var(--r);border:1px solid rgba(255,255,255,.18);background:transparent;color:#fff;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.icon-btn svg{width:20px;height:20px}
.demo-flag{border:1px solid var(--gold-hi);color:var(--gold-hi);font-size:12px;font-weight:700;padding:2px 8px;border-radius:2px}
.offline{background:var(--warn-soft);color:var(--warn);font-size:13px;font-weight:600;text-align:center;padding:6px}

main{max-width:820px;margin:0 auto;padding:18px 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.between{justify-content:space-between}

/* Títulos de sección: inclinados con la cuña dorada del logo, sin mayúsculas */
.sec-title{display:flex;align-items:baseline;gap:10px;margin:26px 0 10px;font-style:italic;font-stretch:72%;font-weight:800;font-size:22px;color:var(--navy);line-height:1.1}
.sec-title::before{content:"";width:16px;height:13px;background:var(--gold);transform:skewX(-20deg);flex:0 0 auto;align-self:center}
.sec-title .r{margin-left:auto;font-style:normal;font-stretch:100%;font-weight:500;font-size:14px;color:var(--steel)}

/* ---------- Hojas ---------- */
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px}
.card.tap{cursor:pointer}
.card.tap:active{background:#f6f8f9}
.card.cream{background:var(--cream);border-color:#e7d8c3}
.card h3{margin-bottom:4px}
/* Las listas son una sola hoja con filas, no un montón de tarjetas */
.list{display:flex;flex-direction:column;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.list > .card{border:0;border-radius:0;border-bottom:1px solid var(--rule-2)}
.list > .card:last-child{border-bottom:0}
.list:has(> .dcard){background:none;border:0;gap:12px;overflow:visible}
.list:has(> .dcard) > .dcard{border:1px solid var(--rule);border-radius:var(--r)}
.list > p{padding:12px 16px;margin:0}
.item{display:flex;align-items:center;gap:12px}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:800;font-style:italic;font-stretch:75%;font-size:17px;flex:0 0 auto}
.avatar.lg{width:60px;height:60px;font-size:24px}
.chev{color:var(--steel-2);font-size:22px}
.badge{display:inline-block;font-size:12.5px;font-weight:700;padding:3px 8px;border-radius:2px;white-space:nowrap;background:var(--rule-2);color:var(--steel);line-height:1.3}
.badge.ok{background:var(--ok-soft);color:var(--ok)} .badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--bad-soft);color:var(--bad)} .badge.gold{background:var(--gold-soft);color:#6f5422}
.badge.navy{background:var(--navy);color:#fff} .badge.tt{background:#fff;color:var(--gold)}

/* Marcador: lo único llamativo de la app son los números */
.stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--navy);border-radius:var(--r);overflow:hidden}
.stat{padding:12px 14px 13px;border-left:1px solid var(--navy-3);color:#fff}
.stat:first-child{border-left:0}
.stat small{display:block;color:#aeb8c2;font-size:13px;font-weight:500;line-height:1.25;min-height:2.5em}
.stat b{display:inline-block;font-style:italic;font-stretch:65%;font-weight:800;font-size:38px;line-height:1;color:#fff;font-variant-numeric:tabular-nums;margin-top:2px}
.stat i{font-style:normal;font-size:13px;margin-left:5px;color:#aeb8c2}
.stat .up,.stat b.up{color:#f08a76} .stat .down{color:#8fd1a8}
.up{color:var(--bad)} .down{color:var(--ok)}
.empty{text-align:center;padding:26px 18px;color:var(--steel)}
.empty b{display:block;color:var(--navy);font-style:italic;font-stretch:72%;font-weight:800;font-size:22px;margin-bottom:4px}

/* ---------- Botones ---------- */
.btn{border:0;border-radius:var(--r);padding:12px 18px;font-weight:700;font-stretch:88%;font-size:17px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--navy);color:#fff;min-height:48px;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn svg{width:18px;height:18px}
.btn.block{width:100%}
.btn.gold{background:var(--gold)}
.btn.light{background:var(--sheet);color:var(--navy);border:1.5px solid var(--navy)}
.btn.ghost{background:transparent;color:var(--navy);padding:8px 10px;min-height:38px}
.btn.danger{background:var(--sheet);color:var(--bad);border:1.5px solid #e2b3a9}
.btn.sm{padding:8px 13px;min-height:38px;font-size:15px}
.btn[disabled]{opacity:.5;pointer-events:none}
.mini{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);width:36px;height:36px;display:grid;place-items:center;cursor:pointer;color:var(--navy);flex:0 0 auto}
.mini svg{width:17px;height:17px}
.mini.bad{color:var(--bad)}
.mini.ic-train{background:var(--navy);border-color:var(--navy);color:#fff}
.mini.ic-food{background:var(--gold);border-color:var(--gold);color:#fff}

/* ---------- Formularios ---------- */
label.f{display:flex;flex-direction:column;gap:5px;font-size:14px;font-weight:600;color:var(--steel)}
.in,select.in,textarea.in{width:100%;border:1.5px solid var(--rule);background:#fff;border-radius:var(--r);padding:11px 12px;font-size:16px;color:var(--ink);font-weight:400;outline:none}
.in:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(32,42,52,.12)}
textarea.in{min-height:84px;resize:vertical;line-height:1.45}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--navy);flex:0 0 auto}
/* Pestañas: subrayado dorado, no pastillas */
.seg{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--rule)}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:0 0 auto;border:0;background:transparent;padding:10px 12px 9px;font-weight:600;font-size:15px;color:var(--steel);cursor:pointer;white-space:nowrap;border-bottom:3px solid transparent;margin-bottom:-1px}
.seg button.on{color:var(--navy);border-bottom-color:var(--gold);font-weight:800}
.seg button .cnt{margin-left:2px}
.card .seg{margin-bottom:4px}
.scale{display:flex;gap:6px}
.scale button{flex:1;border:1.5px solid var(--rule);background:#fff;border-radius:var(--r);padding:9px 0;font-weight:800;font-style:italic;font-stretch:72%;font-size:18px;cursor:pointer}
.scale button.on{background:var(--navy);color:#fff;border-color:var(--navy)}

/* ---------- Editor de plan ---------- */
.day{border:1px solid var(--rule);border-radius:var(--r);background:#fff;overflow:hidden}
.day-head{background:var(--navy);color:#fff;padding:10px 12px;display:flex;gap:8px;align-items:center}
.day-head .in{background:transparent;border-color:rgba(255,255,255,.25);color:#fff;font-weight:800;font-style:italic;font-stretch:75%;font-size:20px;padding:7px 10px}
.day-head .mini{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}
.ex{padding:12px;border-bottom:1px solid var(--rule-2);display:flex;flex-direction:column;gap:8px}
.ex-top{display:flex;gap:8px;align-items:center}
.ex-num{min-width:26px;font-style:italic;font-stretch:65%;font-weight:800;font-size:22px;color:var(--gold);text-align:center;flex:0 0 auto}
.ex .grid4 .in{padding:9px 6px;font-size:16px;text-align:center;font-weight:700}
.ex .lbl{font-size:12px;color:var(--steel);text-align:center;margin-bottom:2px;font-weight:600}
.day-foot{padding:10px 12px;background:#f7f9fa}

/* ---------- Plan del día (cliente) ---------- */
.dcard{padding:0;overflow:hidden}
.dhead{background:var(--navy);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.dhead h3{color:#fff;margin:0;font-size:22px}
.dcard.next{border-color:var(--gold)!important;box-shadow:0 0 0 1px var(--gold)}
.dcard.next .dhead{background:var(--gold)}
.dbody{padding:12px 16px 16px}

/* ---------- Sesión de entreno ---------- */
.exs{background:#fff;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.exs-head{background:var(--navy);color:#fff;padding:12px 16px}
.exs-head b{font-style:italic;font-stretch:72%;font-weight:800;font-size:22px;color:#fff}
.exs-head .muted{color:#b9c3cc!important}
.target{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.chip{background:var(--rule-2);border-radius:2px;padding:3px 8px;font-size:13px;font-weight:700;color:var(--navy)}
.chip.gold{background:var(--gold-soft);color:#6f5422}
.exs-head .chip{background:rgba(255,255,255,.12);color:#fff}
.exs-head .chip.gold{background:var(--gold);color:#fff}
.set-head{padding:8px 16px 0;display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;font-size:12.5px;color:var(--steel);text-align:center;font-weight:600}
.set{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:8px;align-items:center;padding:8px 16px;border-bottom:1px solid var(--rule-2)}
.set:last-child{border-bottom:0}
.set .n{font-style:italic;font-stretch:65%;font-weight:800;font-size:22px;color:var(--steel-2);text-align:center}
.set .in{text-align:center;padding:8px 4px;font-style:italic;font-stretch:68%;font-weight:800;font-size:26px;color:var(--navy);font-variant-numeric:tabular-nums}
.set .in::placeholder{color:#b8c0c8;font-weight:500}
.set.done{background:var(--ok-soft)}
.set.done .in{border-color:#9cc7ad}
.set.done .n{color:var(--ok)}
.tick{width:44px;height:44px;border-radius:var(--r);border:1.5px solid var(--rule);background:#fff;display:grid;place-items:center;cursor:pointer;color:#c3cbd2}
.tick svg{width:22px;height:22px}
.set.done .tick{background:var(--ok);border-color:var(--ok);color:#fff}
.exs-foot{padding:6px 12px;background:#f7f9fa;border-top:1px solid var(--rule-2)}

/* ---------- Comidas ---------- */
.meal{background:#fff;border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.meal-head{background:var(--navy);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:8px}
.meal-head b{font-style:italic;font-stretch:72%;font-weight:800;font-size:21px;flex:1}
.meal-head span{color:var(--gold-hi);font-weight:700}
.meal-head .in{font-stretch:100%}
.opt{display:grid;grid-template-columns:42px 1fr;border-bottom:1px solid var(--rule-2)}
.opt:last-child{border-bottom:0}
.opt .k{padding:10px 0 10px 16px;font-style:italic;font-stretch:65%;font-weight:800;color:var(--gold);font-size:20px;line-height:1.1}
.opt .v{padding:11px 16px 11px 0;font-size:15px}
.opt.special{background:var(--cream)}
.macros{display:grid;grid-template-columns:repeat(4,1fr);background:var(--navy);border-radius:var(--r);overflow:hidden}
.macro{padding:11px 10px;text-align:left;border-left:1px solid var(--navy-3);color:#fff}
.macro:first-child{border-left:0}
.macro b{display:block;font-style:italic;font-stretch:65%;font-weight:800;font-size:30px;line-height:1;color:#fff}
.macro b i{font-style:italic;font-size:16px;color:var(--gold-hi);margin-left:1px}
.macro small{color:#aeb8c2;font-size:13px}
.prose{white-space:pre-wrap;font-size:15px}

/* ---------- Gráficas ---------- */
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:#e3e7eb;stroke-width:1}
.chart .ln{fill:none;stroke:var(--navy);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:url(#cg);opacity:.9}
.chart .dt{fill:#fff;stroke:var(--navy);stroke-width:2}
.chart .dt.last{fill:var(--gold);stroke:var(--gold)}
.chart text{font-size:12px;fill:var(--steel);font-family:var(--cond)}

/* ---------- Tablas ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{background:var(--navy);color:#fff;font-weight:700;padding:8px 8px;text-align:left;font-size:13px}
.tbl td{padding:9px 8px;border-bottom:1px solid var(--rule-2);font-variant-numeric:tabular-nums}
.tbl tr:last-child td{border-bottom:0}
.tbl-wrap{overflow-x:auto;border-radius:var(--r);border:1px solid var(--rule);background:#fff}
.tbl td .mini{display:inline-grid;vertical-align:middle;margin-left:6px;width:30px;height:30px}

/* ---------- Barra inferior ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--navy);display:flex;padding:4px 4px calc(var(--safe-b) + 4px)}
.tabs button{position:relative;flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 7px;color:#9aa6b2;font-size:12px;font-weight:600;cursor:pointer}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:#fff}
.tabs button.on svg{color:var(--gold-hi)}
.tabs button.on::before{content:"";position:absolute;top:-4px;left:30%;right:30%;height:3px;background:var(--gold-hi);transform:skewX(-20deg)}
.tb-badge{position:absolute;top:2px;left:calc(50% + 5px);background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 5px;line-height:1}
.cnt{display:inline-grid;place-items:center;background:var(--bad);color:#fff;font-size:11.5px;font-weight:800;min-width:20px;height:20px;border-radius:10px;padding:0 6px;line-height:1;vertical-align:middle}

/* ---------- Acceso ---------- */
.auth{min-height:100vh;background:var(--navy);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(var(--safe-t) + 24px) 20px calc(var(--safe-b) + 24px)}
.auth .logo{width:min(300px,72vw);height:auto;margin-bottom:18px}
.auth .box{width:100%;max-width:400px;background:#fff;color:var(--ink);border-radius:var(--r);padding:24px;border-top:4px solid var(--gold)}
.auth h1{margin-bottom:4px}
.auth .alt{margin-top:14px;text-align:center;font-size:14px;color:#aeb8c2}
.auth .alt a{color:var(--gold-hi);font-weight:600}
.err{background:var(--bad-soft);color:var(--bad);padding:10px 12px;border-radius:var(--r);font-size:14px}
.info{background:var(--gold-soft);color:#5f4719;padding:10px 12px;border-radius:var(--r);font-size:14px}

/* ---------- Avisos y ventanas ---------- */
.toast{position:fixed;left:50%;bottom:calc(var(--safe-b) + 96px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;border-left:4px solid var(--gold);
  padding:12px 18px;border-radius:var(--r);font-weight:600;font-size:15px;opacity:0;transition:.25s;z-index:60;max-width:90vw;text-align:center;pointer-events:none}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(20,26,33,.6);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:520px;border-radius:10px 10px 0 0;padding:22px 18px calc(var(--safe-b) + 18px);max-height:90vh;overflow:auto;border-top:4px solid var(--gold)}
@media (min-width:700px){ .modal{align-items:center} .sheet{border-radius:var(--r)} }
.spinner{width:28px;height:28px;border:3px solid var(--rule);border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin:40px auto}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spinner{animation-duration:2s} .toast{transition:none} }

/* ---------- Mensajes ---------- */
.chat{display:flex;flex-direction:column;gap:6px;justify-content:flex-end;min-height:calc(100vh - 270px);padding-bottom:6px}
.bub{max-width:82%;align-self:flex-start;background:#fff;border:1px solid var(--rule);border-radius:12px 12px 12px 3px;padding:8px 12px}
.bub.me{align-self:flex-end;background:var(--navy);color:#fff;border-color:var(--navy);border-radius:12px 12px 3px 12px}
.bub.pend{opacity:.55}
.bt{white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px}
.bm{font-size:12px;opacity:.65;text-align:right;margin-top:2px}
.bm .rd{color:var(--gold-hi);font-weight:800}
.daysep{align-self:center;font-size:13px;color:var(--steel);font-weight:600;margin:12px 0 4px}
.daysep::first-letter{text-transform:uppercase}
.composer{position:sticky;bottom:calc(var(--safe-b) + 74px);display:flex;gap:8px;align-items:flex-end;padding:10px 0 6px;background:var(--chalk);z-index:5}
body.no-tabs .composer{bottom:calc(var(--safe-b) + 6px)}
.composer textarea{resize:none;min-height:48px;max-height:140px;line-height:1.35}
.composer .btn{width:52px;padding:0;flex:0 0 auto}

/* ---------- Fotos ---------- */
.pdate{font-size:14px;font-weight:700;color:var(--steel);margin:14px 2px 6px}
.pdate::first-letter{text-transform:uppercase}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.ph{border:0;padding:0;background:var(--rule-2);border-radius:var(--r);overflow:hidden;position:relative;aspect-ratio:3/4;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph span{position:absolute;left:0;bottom:0;background:var(--navy);color:#fff;font-size:12px;font-weight:700;padding:3px 8px;text-transform:capitalize}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cmp figure{margin:0}
.cmp img,.cmp .noimg{width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r);background:var(--rule-2);display:block}
.cmp figcaption{font-size:13px;text-align:center;color:var(--steel);margin-top:4px}
.upl{display:block;cursor:pointer}
.upl-box{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;aspect-ratio:3/4;border:1.5px dashed #b9c2ca;border-radius:var(--r);background:#f6f8f9 center/cover no-repeat;color:var(--navy);text-align:center}
.upl-box svg{width:24px;height:24px}
.upl-box b{font-size:15px}
.upl-box small{font-size:12px;color:var(--steel)}
.upl-box.has{border-style:solid;border-color:var(--gold)}
.upl-box.has > *{visibility:hidden}
label.btn{cursor:pointer}

/* ---------- Estados y pagos ---------- */
.card.late{box-shadow:inset 4px 0 0 var(--bad)}
.card.pend{box-shadow:inset 4px 0 0 var(--gold)}
.late-tag{display:inline-block;background:var(--bad-soft);color:var(--bad);font-size:12px;font-weight:700;padding:1px 6px;border-radius:2px;margin-left:5px;vertical-align:1px}
.paycard{border-top:4px solid var(--gold)}
.paycard.bad{border-top-color:var(--bad);background:#fdf5f3}
.paycard .badge{flex:0 0 auto}
.paycard b[style]{font-style:italic;font-stretch:72%;font-weight:800}

@media (min-width:700px){ main{padding:24px 20px} }

/* Resúmenes de progreso */
.form-h{font-weight:800;font-size:15px;color:var(--navy);margin-top:6px}
.better{color:var(--ok);font-weight:700} .worse{color:var(--bad);font-weight:700}
.tbl.prog th,.tbl.prog td{white-space:nowrap}
.tbl.prog td.ex{position:sticky;left:0;background:#fff;z-index:1;box-shadow:1px 0 0 var(--rule-2)}
.tbl.prog th:first-child{position:sticky;left:0;z-index:2}
.tbl.bodyt td+td,.tbl.bodyt th+th{text-align:right}
.card.flush{padding:0}
.tbl.wkt td,.tbl.wkt th{white-space:nowrap}
.exr{display:flex;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--rule-2)}
.exr:last-child{border-bottom:0}
.exr .small{margin-top:2px}
.exr-top{flex:0 0 auto;text-align:right}
.exr-top small{display:block;font-size:12px;color:var(--steel)}
.exr-top b{font-style:italic;font-stretch:70%;font-weight:800;font-size:22px;color:var(--navy);white-space:nowrap}
.sum-head{display:flex;flex-direction:column;margin:0 2px 12px}
.sum-head b{font-style:italic;font-stretch:72%;font-weight:800;font-size:28px;color:var(--navy);line-height:1.05}
.sum-head span{color:var(--steel);font-size:14px;margin-top:4px}

/* Bienvenida */
.welcome{position:fixed;inset:0;z-index:60;background:var(--navy);color:#fff;overflow:auto;display:flex;justify-content:center;animation:wIn .35s ease-out}
.welcome::before{content:"";position:fixed;inset:0;background:url(assets/logo-light.png) center 58%/min(150vw,760px) no-repeat;opacity:.05;pointer-events:none}
.welcome::after{content:"";position:fixed;left:0;right:0;top:0;height:4px;background:var(--gold)}
.welcome-in{position:relative;width:100%;max-width:520px;padding:calc(env(safe-area-inset-top) + 34px) 24px calc(var(--safe-b) + 28px);display:flex;flex-direction:column;min-height:100%}
.welcome-logo{width:132px;margin-bottom:26px}
.welcome h1{font-style:italic;font-stretch:65%;font-weight:800;font-size:46px;line-height:1;margin:0 0 18px;color:#fff}
.welcome-txt{flex:1;font-size:17px;line-height:1.55;color:#d9dfe5}
.welcome-txt p{margin:0 0 14px}
.welcome .btn{margin-top:18px;font-size:17px;padding:15px}
.welcome.out{opacity:0;transition:opacity .25s}
@keyframes wIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.welcome{animation:none}.welcome.out{transition:none}}

/* Vídeos de ejercicios */
.vids{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vid{display:inline-flex;align-items:center;gap:5px;font-size:13.5px;font-weight:700;color:var(--navy);background:var(--gold-soft);padding:5px 10px;border-radius:2px;text-decoration:none}
.vid svg{width:12px;height:12px}

/* Datos de transferencia */
.xfer{display:flex;flex-direction:column;gap:10px;background:var(--chalk);border:1px solid var(--rule);border-radius:var(--r);padding:12px}
.xfer small{display:block;font-size:12.5px;color:var(--steel)}
.xfer b{font-size:15.5px;color:var(--navy)}
.xfer .iban{font-variant-numeric:tabular-nums;letter-spacing:.02em;font-size:16px;word-break:break-word;-webkit-user-select:all;user-select:all}
</style>
</head>

<div id="app"><div class="spinner"></div></div>
<div class="toast" id="toast"></div>

<script src="vendor/supabase.js"></script>
<script src="app.js"></script>

  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
</script>
